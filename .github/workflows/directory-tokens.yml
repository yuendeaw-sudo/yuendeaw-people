name: Directory sibling token compatibility
on:
  pull_request:
    paths:
      - 'app/api/directory/is-employee/route.ts'
      - 'app/api/directory/identity/route.ts'
      - 'tests/directory-identity.mjs'
      - 'tests/directory-tokens.mjs'
      - '.github/workflows/directory-tokens.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node tests/directory-tokens.mjs
      - run: node tests/directory-identity.mjs
      - run: npx tsc --noEmit
      - run: git diff --check
